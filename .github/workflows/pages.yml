# 生成介绍页并发布到 GitHub Pages。页面和字体在这里由 site/build.py --page 生成，不进仓库，所以改 Skill、样片不用动 site/。静帧发布时从 samples/、packs/ 拷进 site/media/；视频不进仓库，从 Release「media」下载进 site/media/（scripts/media.py 维护）；再由 site/small.py 出卡片用的小版到 site/media/s/、首页大视频到 site/media/m/。
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "skills/ai-coding-video/**", "samples/*/**", "packs/*/**", "media.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 裁字体用的原字体：只装 site/build.py 用到的几个 @fontsource 包（版本取 samples/package.json），装在仓库外面
      - name: 准备生成页面的工具
        run: |
          pip install -q fonttools brotli
          echo "FONTSRC=$RUNNER_TEMP/fontsrc/node_modules/@fontsource" >> "$GITHUB_ENV"
          echo "FONT_PKGS=$(python3 site/build.py --font-packages)" >> "$GITHUB_ENV"
      - id: font-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fontsrc/node_modules
          key: fontsrc-${{ hashFiles('samples/package.json') }}
      - name: 下载原字体
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/fontsrc" $FONT_PKGS
      - name: 生成页面和字体
        run: python3 site/build.py --page
      - name: 拷静帧、下载视频
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/media
          cp samples/*/*-16x9.jpg samples/*/*-9x16.jpg site/media/
          # 视频在 Release 里已按 media/ 的命名存放（风格包的带前缀 pack-）
          gh release download media -R "$GITHUB_REPOSITORY" -p '*.mp4' -D site/media --clobber
          # 真实应用案例的封面（视频已在上一行：原版、中版 case-<名字>.mp4、case-<名字>-mid.mp4）
          gh release download media -R "$GITHUB_REPOSITORY" -p 'case-*.jpg' -D site/media --clobber
          # 风格包静帧：packs/<名字>/demo/<名字>-<颜色>-<画幅>.jpg → media/pack-<名字>-<颜色>-<画幅>.jpg，命名和 site/build.py 一致
          for f in packs/*/demo/*.jpg; do
            [ -f "$f" ] && cp "$f" "site/media/pack-$(basename "$f")"
          done
      # 卡片用的小视频、小静帧（site/small.py → site/media/s/）；原版和小版脚本都没变就直接用缓存
      - id: small-cache
        uses: actions/cache@v4
        with:
          path: |
            site/media/s
            site/media/m
          key: small-${{ hashFiles('media.json', 'site/small.py', 'samples/*/*-16x9.jpg', 'samples/*/*-9x16.jpg', 'packs/*/demo/*.jpg') }}
      - name: 出小版
        if: steps.small-cache.outputs.cache-hit != 'true'
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          python3 site/small.py
      - name: 去掉不发布的文件
        run: rm -rf site/src site/build.py site/small.py site/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # 等 Pages 同步文件最多 30 分钟（默认 10 分钟，页面连视频约 800 MB，GitHub 那边慢时会超时）
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
