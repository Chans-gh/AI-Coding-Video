# 把 site/ 发布到 GitHub Pages。静帧发布时从 samples/、packs/ 拷进 site/media/；视频不进仓库，从 Release「media」下载进 site/media/（scripts/media.py 维护）。
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "samples/*/**", "packs/*/demo/**", "media.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 拷静帧、下载视频
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/media
          cp samples/*/*-16x9.jpg samples/*/*-9x16.jpg site/media/
          # 视频在 Release 里已按 media/ 的命名存放（风格包的带前缀 pack-）
          gh release download media -R "$GITHUB_REPOSITORY" -p '*.mp4' -D site/media --clobber
          # 风格包静帧：packs/<名字>/demo/<名字>-<颜色>-<画幅>.jpg → media/pack-<名字>-<颜色>-<画幅>.jpg，命名和 site/build.py 一致
          for f in packs/*/demo/*.jpg; do
            [ -f "$f" ] && cp "$f" "site/media/pack-$(basename "$f")"
          done
          rm -rf site/src site/build.py site/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
